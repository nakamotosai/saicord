[package]
name = "saicord"
version = "0.6.1"
edition = "2021"
description = "极简区域录屏：框选 → 开始 → 自动出片到桌面"
license = "MIT"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Networking_WinHttp",
] }
windows-capture = "2.0.1"
parking_lot = "0.12"

# 本地补丁:上游 windows-capture 2.0.1 把硬件编码写死成 true,机器上硬件 MFT
# 被系统拒绝(GRL 缺失/被吊销等)时起录直接失败且无退路。补丁给
# VideoSettingsBuilder 加了 hardware_acceleration(bool),让 saicord 自动降级软件编码。
# 见 vendor/windows-capture/PATCH.md(升级上游时怎么重打)。
[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
